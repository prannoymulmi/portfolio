name: CI Pipeline

on:
  push:
    branches: [main, 001-senior-portfolio]
  pull_request:
    branches: [main, 001-senior-portfolio]
    # `types` is set once per `pull_request` trigger for the whole workflow,
    # not per-job — `ready_for_review` is added here (on top of GitHub's
    # implicit defaults: opened, synchronize, reopened) so the `e2e` job
    # below actually fires on the draft -> ready-for-review transition,
    # since it's gated separately by its own `if: github.event.pull_request
    # .draft == false` (research.md Decision 3, FR-005a). This broadens the
    # trigger for every job in this workflow, not just `e2e` — but
    # lint-and-type-check/test/build have no draft-status condition, so this
    # is purely additive for them: they still run on every event they did
    # before, plus one extra (harmless, idempotent) run on
    # ready_for_review.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm run type-check

      - name: Run ESLint
        run: pnpm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test --coverage --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Check bundle size
        run: du -sh .next/static/ && ls -lh .next/static/chunks/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    # Keeps this job from running while the PR is still a draft, even though
    # the workflow itself now fires on synchronize/opened/ready_for_review
    # for a draft PR too (research.md Decision 3, FR-005a). Shows as
    # "skipped" on the PR checks list, not silently absent.
    if: github.event.pull_request.draft == false

    steps:
      # Waits for the PR's Vercel preview deployment to become ready and
      # captures its URL. This polls the GitHub Deployments API for the
      # `deployment_status` event Vercel's own GitHub App already posts
      # against this PR's head commit — it does NOT trigger a new
      # deployment via the Vercel CLI/API (research.md Decision 2). Do not
      # "simplify" this into a `vercel deploy` / `vercel deploy --prebuilt`
      # call; that would create a second, redundant deployment.
      #
      # Pinned to the tagged v1.3.3 release (not @master) — verified directly
      # against the action's README: token + max_timeout (seconds) as
      # inputs, `url` as output.
      #
      # This Vercel project has Deployment Protection on preview deployments
      # (returns 401 to unauthenticated requests, including this action's own
      # polling — discovered live on this PR's first CI run). VERCEL_AUTOMATION_
      # BYPASS_SECRET is the "Protection Bypass for Automation" secret generated
      # in Vercel's dashboard (Project Settings -> Deployment Protection) and
      # stored as a GitHub Actions repo secret — it lets only this CI pipeline
      # through, real visitors still hit the login wall as before. Sent as the
      # `x-vercel-protection-bypass` header (action's vercel_protection_bypass_
      # header input does this internally); the same secret is passed to
      # Playwright below so its own requests carry the header too.
      - name: Wait for Vercel preview deployment
        id: wait-for-vercel-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.wait-for-vercel-preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
